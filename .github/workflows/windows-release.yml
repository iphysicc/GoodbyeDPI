name: Windows build and release

# Builds the engine, the panel and the setup file on Windows.
# A pushed tag like v1.2.0 publishes them as a GitHub release
# (the panel's update check reads the latest release).

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools (MinGW, Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            choco install mingw -y --no-progress
            "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
          choco install innosetup -y --no-progress

      - name: Build
        shell: pwsh
        run: |
          gcc --version | Select-Object -First 1
          dotnet --version
          ./build.ps1 -Clean

      - name: Check version against tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content panel/GoodbyeDPI.Panel.csproj)).Project.PropertyGroup.Version | Select-Object -First 1
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match panel version $ver" }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @('GoodbyeDPI-Kurulum.exe', 'GoodbyeDPI-Panel.exe')
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash (Join-Path dist $f) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $f"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-${{ github.sha }}
          path: |
            dist/GoodbyeDPI-Kurulum.exe
            dist/GoodbyeDPI-Panel.exe
            dist/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/GoodbyeDPI-Kurulum.exe dist/GoodbyeDPI-Panel.exe dist/SHA256SUMS.txt `
            --title "GoodbyeDPI $env:GITHUB_REF_NAME" --notes-file installer/RELEASE_NOTES.md
